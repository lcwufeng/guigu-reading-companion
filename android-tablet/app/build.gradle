plugins {
    id "com.android.application"
}

android {
    namespace "online.guiguibandu.tablet"
    compileSdk 35

    defaultConfig {
        applicationId "online.guiguibandu.tablet"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def signingFile = rootProject.file("signing.properties")
            if (signingFile.exists()) {
                def signing = new Properties()
                signing.load(new FileInputStream(signingFile))
                storeFile rootProject.file(signing["storeFile"])
                storePassword signing["storePassword"]
                keyAlias signing["keyAlias"]
                keyPassword signing["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (rootProject.file("signing.properties").exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
